      - "03 · Kapitalisierung & Basel III": comparison/reports/03_kapitalisierung_regulierung_und_staatsgarantie.md
      - "04 · Ausschüttung & Vergütung real": comparison/reports/04_ausschuettung_eigentuemer_und_verguetung_real.md
