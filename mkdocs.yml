site_name: XKB Geschäftsberichte Analysen (16 Schweizer Banken)
site_description: >-
  Strukturierte Längsschnitt-, Bilanz-, Risiko-, Effizienz-, Leadership-, IT- und Fusionsanalysen
  für 16 Schweizer Banken (Kantonal-, Gross-, Privat-, Genossenschafts- und Regionalbanken)
  inklusive institutsübergreifendem Benchmarking.
site_author: chatelao
repo_url: https://github.com/chatelao/xkb-geschaeftsbereichte-analysen
repo_name: chatelao/xkb-geschaeftsbereichte-analysen

docs_dir: .rtd_docs
site_dir: site

theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

